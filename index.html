<body>
  <div id="root"></div>
  <script type="text/javascript">
    // Druga połowa triku spa-github-pages — odczytuje adres zapisany przez
    // 404.html w parametrze zapytania (?/...) i przywraca go przez
    // history.replaceState, zanim React Router zdąży się zainicjować.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?')
        window.history.replaceState(
          null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        )
      }
    }(window.location));
  </script>
